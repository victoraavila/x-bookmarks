[project]
name = "x-bookmarks"
version = "0.1.0"
description = "Local, searchable archive of your X (Twitter) bookmarks with a fresh-sync engine and an MCP server for OpenCode"
requires-python = ">=3.11"
dependencies = [
    "twscrape>=0.20.0",
    "mcp>=1.2.0",
]

[project.scripts]
xbm = "xbm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["xbm"]

[tool.uv]
package = true
